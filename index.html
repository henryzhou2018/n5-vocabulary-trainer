<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172a46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="N5单词"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>JLPT N5 单词训练</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#172a46;background:#f2f5fa}*{box-sizing:border-box}body{margin:0;min-height:100dvh}main{max-width:520px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:21px;margin:0}small,.muted{color:#69768a}.tag{font-size:12px;background:#e0e9f7;border-radius:99px;padding:7px 10px}.card{margin-top:22px;background:white;border-radius:25px;box-shadow:0 10px 30px #14294513;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px 12px;text-align:center}.word{font-size:clamp(42px,12vw,70px);font-weight:700;overflow-wrap:anywhere;line-height:1.4}.reading{font-size:23px;margin-top:13px;color:#4c6482;min-height:34px}.meaning{font-size:30px;font-weight:650;color:#14846e;margin-top:14px;min-height:42px}.hidden{visibility:hidden}.hint{font-size:13px;color:#8895a5;margin-top:18px}.settings{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:#fff;border-radius:14px;padding:13px;font-size:13px;color:#58677c}.field input{width:100%;margin-top:7px;border:1px solid #d7e0eb;border-radius:9px;padding:9px;font-size:18px;color:#172a46}button{cursor:pointer;border:0;border-radius:14px;padding:14px 10px;font-size:15px;font-weight:650;background:#e3eaf5;color:#172a46}button.primary{background:#285fba;color:white}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:16px}.secondary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.options{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:17px;font-size:14px}.options label{display:flex;align-items:center;gap:5px}.footer{margin-top:17px;text-align:center;font-size:13px;color:#7b889a}.status{margin-top:12px;text-align:center;font-size:13px;color:#596d87}button:disabled{opacity:.45}input[type=checkbox]{accent-color:#285fba} .progress{height:5px;background:#e4ebf4;border-radius:8px;overflow:hidden;margin-top:15px}.progress>div{height:100%;width:0;background:#285fba;transition:width .2s linear}
</style></head><body><main><header><h1>日本語 · N5 单词</h1><span class="tag" id="count"></span></header><div class="card" aria-live="polite"><div class="word" id="word">準備できましたか？</div><div class="reading hidden" id="reading"></div><div class="meaning hidden" id="meaning"></div><div class="hint" id="hint">点击「开始」学习</div></div><div class="progress"><div id="progress"></div></div><div class="settings"><label class="field">答案延迟（秒）<input id="reveal" type="number" min="1" max="120" value="5" inputmode="numeric"></label><label class="field">下个单词延迟（秒）<input id="nextdelay" type="number" min="1" max="120" value="3" inputmode="numeric"></label></div><div class="actions"><button id="prev">← 上一词</button><button id="show">显示答案</button><button id="next">下一词 →</button></div><div class="secondary"><button class="primary" id="toggle">▶ 开始</button><button id="speak">🔊 朗读单词</button></div><div class="options"><label><input id="autoaudio" type="checkbox" checked>自动朗读</label><label><input id="showreading" type="checkbox" checked>答案时显示假名</label></div><div class="status" id="status">准备就绪</div><div class="footer">随机不重复抽取 · 离线可用 · iPhone / Windows</div></main><script src="words.js"></script><script src="app.js"></script></body></html>
